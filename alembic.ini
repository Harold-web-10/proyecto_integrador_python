# Alembic configuration
# Commands:
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sysroot = true

# Database URL (overridden at runtime by env.py from settings.DATABASE_URL)
sqlalchemy.url = sqlite:///./app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
datefmt = %H:%M:%S
format = %(levelname)-5.5s [%(name)s] %(message)s
